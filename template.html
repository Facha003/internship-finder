<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project &amp; internship finder</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --text: #1b1c1e; --muted: #646a72; --line: #e1e1dc; --chip: #efefea;
    --accent: #1f5fbf; --good: #1d7a3e; --good-bg: #e3f4e8; --info: #1f5fbf; --info-bg: #e4eefb;
    --plain: #6b6f76; --plain-bg: #ececea; --idea-bg: #fbf6e6; --idea-line: #e8d9a4; --warn-bg: #fff1dc; --warn: #8a5300;
    --urgent: #b3261e; --urgent-bg: #fde7e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161719; --panel: #1f2124; --text: #e8e8e5; --muted: #9aa0a8; --line: #33363b; --chip: #2a2d32;
      --accent: #82b2ff; --good: #7fd69a; --good-bg: #1c3626; --info: #8fbaff; --info-bg: #1c2c44;
      --plain: #a3a7ae; --plain-bg: #2a2c30; --idea-bg: #2c2817; --idea-line: #574b1f; --warn-bg: #3a2c12; --warn: #f0c070;
      --urgent: #ff9a92; --urgent-bg: #45201d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header { padding: 22px 0 8px; display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; }
  h1 { margin: 0 0 2px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; }
  input, select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
  button, a.btn { cursor: pointer; }
  button:hover, a.btn:hover { border-color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .modes button { border: 0; border-radius: 0; padding: 9px 18px; font-weight: 600; background: transparent; }
  .modes button[aria-pressed=true] { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .modes button[aria-pressed=true] { color: #10141c; } }

  details.me { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; }
  details.me.todo { background: var(--warn-bg); border-color: transparent; }
  details.me summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
  details.me.todo summary { color: var(--warn); }
  .me-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; padding: 4px 14px 14px; }
  .me-grid label { display: block; font-size: 12.5px; color: var(--muted); }
  .me-grid input { width: 100%; margin-top: 3px; }

  .bar { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tab { border-radius: 20px; padding: 6px 14px; }
  .tab[aria-selected=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab .n { opacity: .65; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .filters { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
  .filters input[type=search] { flex: 1 1 220px; min-width: 0; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; color: var(--muted); font-size: 14px; }
  label.chk input { padding: 0; }
  [data-for].off { display: none; }

  main { padding: 16px 0 70px; }
  .hint { color: var(--muted); font-size: 13px; }
  #tabhint { margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card.dim { opacity: .55; }
  .top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .name { font-size: 18px; font-weight: 650; margin: 4px 0 0; }
  .who { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .who b { color: var(--text); font-weight: 600; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 12px; margin: 0 6px 2px 0; }
  .badge.good { color: var(--good); background: var(--good-bg); }
  .badge.info { color: var(--info); background: var(--info-bg); }
  .badge.plain { color: var(--plain); background: var(--plain-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.urgent { color: var(--urgent); background: var(--urgent-bg); }
  .does { margin: 8px 0 10px; }
  .row { display: flex; gap: 10px; margin: 6px 0; }
  .row > .k { flex: 0 0 118px; color: var(--muted); font-size: 12.5px; padding-top: 2px; }
  .row > .v { flex: 1; min-width: 0; }
  .chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 1px 7px; margin: 0 4px 4px 0; font-size: 13px; }
  .chip.sector { background: transparent; border: 1px solid var(--line); }
  blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line); font-style: italic; }
  .src { font-size: 12.5px; font-style: normal; white-space: nowrap; }
  .idea { background: var(--idea-bg); border: 1px solid var(--idea-line); border-radius: 8px; padding: 8px 12px; }
  .idea small { color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  a.btn { border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; color: var(--text); background: var(--panel); }
  a.btn.primary, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { a.btn.primary, button.primary { color: #10141c; } }
  a.btn:hover { text-decoration: none; }
  .actions input { flex: 1 1 180px; min-width: 0; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .empty { padding: 50px 0; text-align: center; color: var(--muted); }
  #more { display: block; margin: 0 auto; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 9px 14px; margin: 10px 0; font-size: 14px; }
  .notice button { margin-left: 8px; }
  details.addbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; }
  details.addbox summary { padding: 11px 16px; cursor: pointer; font-weight: 600; }
  .addgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; padding: 4px 16px 6px; }
  .addgrid label { display: block; font-size: 12.5px; color: var(--muted); }
  .addgrid input { width: 100%; margin-top: 3px; }
  .addfoot { padding: 6px 16px 14px; display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
  a.bookmark { border: 1px dashed var(--accent); border-radius: 7px; padding: 5px 12px; font-weight: 600; cursor: grab; }
  footer { border-top: 1px solid var(--line); margin-top: 30px; padding: 14px 0 40px; color: var(--muted); font-size: 12.5px; }
  footer .src-ok { color: var(--good); } footer .src-bad { color: var(--urgent); font-weight: 600; }
  footer .tools { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 560px) { .row { display: block; } .row > .k { margin-bottom: 2px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Project &amp; internship finder</h1>
      <div class="sub" id="summary"></div>
    </div>
    <div class="modes" role="group" aria-label="What are you looking for?">
      <button data-mode="bachelor">Bachelor project</button>
      <button data-mode="intern">Internships</button>
    </div>
  </header>

  <div id="notices"></div>

  <details class="me" id="me">
    <summary id="me-title">Our details</summary>
    <div class="me-grid">
      <label data-for="intern">My name (internship emails)<input id="g-mitt_navn" placeholder="Ola Nordmann"></label>
      <label data-for="bachelor">Group names (comma-separated)<input id="g-navn" placeholder="Ola Nordmann, Kari Nordmann, …"></label>
      <label>Study programme<input id="g-studieprogram" placeholder="dataingeniør"></label>
      <label data-for="bachelor">Semester<input id="g-semester" placeholder="våren 2027"></label>
      <label>Contact email<input id="g-kontakt_epost" type="email" placeholder="you@oslomet.no"></label>
      <label>Phone<input id="g-telefon" placeholder="optional"></label>
    </div>
  </details>
</div>

<div class="bar"><div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search…" aria-label="Search">
    <select id="f-tier" data-for="bachelor" aria-label="Availability"><option value="">Any availability</option></select>
    <select id="f-sector" data-for="bachelor" aria-label="Sector"><option value="">Any sector</option></select>
    <select id="f-type" data-for="intern" aria-label="Type"><option value="">Any type</option></select>
    <label class="chk" data-for="intern"><input type="checkbox" id="f-new"> New only</label>
    <label class="chk" data-for="intern"><input type="checkbox" id="f-closed"> Show closed</label>
    <label class="chk" data-for="intern"><input type="checkbox" id="f-nofit"> <span id="nofit-label">Show ones I probably can't get</span></label>
    <button id="export" title="Download your statuses and notes as a spreadsheet">Export tracking</button>
  </div>
</div></div>

<div class="wrap"><main>
  <div class="hint" id="tabhint"></div>
  <details class="addbox" id="addbox" hidden>
    <summary>Add a position yourself (from finn.no, LinkedIn or anywhere)</summary>
    <div class="addgrid">
      <label>Paste a link, or what the Save job button copied<input id="a-paste" placeholder="Paste here"></label>
      <label>Title<input id="a-title" placeholder="Summer intern, software"></label>
      <label>Employer<input id="a-employer"></label>
      <label>Link<input id="a-url" type="url" placeholder="https://…"></label>
      <label>Deadline (optional)<input id="a-deadline" type="date"></label>
    </div>
    <div class="addfoot">
      <button class="primary" id="a-save">Add to my applications</button>
      <span class="hint">One click from any job ad: drag this to your bookmarks bar
        <a class="bookmark" id="bookmarklet" href="#">Save job</a>
        then click it while looking at an ad and paste the result in the first box.</span>
    </div>
  </details>
  <div id="cards"></div>
  <button id="more" hidden>Show more</button>
  <div class="empty" id="empty" hidden></div>
</main>
<footer>
  <div id="sources"></div>
  <div class="tools">
    <button id="backup">Back up my data</button>
    <button id="restore">Restore from backup</button>
    <input type="file" id="restore-file" accept="application/json,.json" hidden>
    <button id="ics-all" data-for="intern">All my deadlines to calendar</button>
    <span id="backup-info"></span>
  </div>
</footer>
</div>
<div id="toast"></div>

<script>
const DATA = /*__DATA__*/null;
const STATUSES = [["", "Not contacted"], ["sent", "Email sent"], ["replied", "Replied"], ["meeting", "Meeting booked"], ["no", "No / dropped"]];
const ISTATUSES = [["", "Not saved"], ["saved", "Saved"], ["applied", "Applied"], ["interview", "Interview"], ["offer", "Offer"], ["rejected", "Rejected / dropped"]];
const PAGE = 60;
const KEY = "bachelor-finder-v1", GKEY = "bachelor-finder-group", IKEY = "bachelor-finder-intern-v1", MKEY = "bachelor-finder-mode";
const BKEY = "bachelor-finder-backup-at";
const BACHELOR_ON = DATA.bachelor !== false;   // false once the bachelor part has been retired

function load(key) { try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { return {}; } }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
const track = load(KEY);     // bachelor project tracking
const itrack = load(IKEY);   // internship tracking: personal, separate from the project
const st = (id) => track[id] || (track[id] = { status: "", note: "" });
const ist = (id) => itrack[id] || (itrack[id] = { status: "", note: "" });

const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
  }
  for (const c of kids) if (c) n.append(c);
  return n;
}
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "");
function link(u, text, cls) {
  u = safeUrl(u);
  return u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text, class: cls || "" }) : null;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1700); }
const rowsById = {}; DATA.rows.forEach((r) => { rowsById[r.id] = r; });
const listingsById = {}; DATA.listings.forEach((l) => { listingsById[l.id] = l; });

/* ---- state ---- */
const TABS = {
  bachelor: [["best", "Best bets"], ["contacted", "Contacted"], ["all", "All"]],
  intern: [["open", "Open positions"], ["programmes", "Companies with programmes"], ["mine", "My applications"]],
};
let mode = "bachelor";
try { if (localStorage.getItem(MKEY) === "intern") mode = "intern"; } catch (e) {}
if (!BACHELOR_ON) {
  mode = "intern";
  document.querySelector(".modes").hidden = true;
  document.querySelector(".modes").style.display = "none";
  document.querySelector("h1").textContent = "Internship finder";
  document.title = "Internship finder";
}
let tab = TABS[mode][0][0], shown = PAGE;

/* ---- dates ---- */
const DAY = 86400000;
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysUntil(iso) { const p = iso.split("-").map(Number); return Math.round((new Date(p[0], p[1] - 1, p[2]) - today0()) / DAY); }
function niceDate(iso) { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
function deadlineInfo(d) {
  if (!d) return { text: "No deadline given", cls: "plain", closed: false, sort: 9e6 };
  if (!d.date) return { text: "Rolling: apply soon", cls: "warn", closed: false, sort: 8e6 };
  const n = daysUntil(d.date), expires = d.kind === "expires", guess = d.kind === "guess";
  const tail = " · " + niceDate(d.date) + (guess ? " (from page text, check)" : "");
  if (n < 0) return { text: (expires ? "Ad expired" : guess ? "Deadline passed" : "Closed") + tail, cls: "plain", closed: true, sort: 9e6 + 1 };
  const verb = expires ? "Ad expires" : "Closes";
  const when = n === 0 ? " today" : n === 1 ? " tomorrow" : " in " + n + " days";
  return { text: verb + when + tail, cls: n <= 7 ? "urgent" : n <= 21 ? "warn" : "good", closed: false, sort: n };
}
const isNew = (l) => l.new && daysUntil(l.first_seen) >= -7;
// The summer people apply for now: this year's until June, next year's after. Computed when the
// page is viewed, so nothing here needs changing from one year to the next.
function nextSummer() { const d = new Date(); return d.getMonth() <= 5 ? d.getFullYear() : d.getFullYear() + 1; }

/* ---- calendar files (.ics) and downloads ---- */
function download(text, name, type) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
}
function icsEvent(id, title, employer, url, iso) {
  const esc = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/([,;])/g, "\\$1").replace(/\r?\n/g, "\\n");
  const ymd = (dt) => dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0");
  const p = iso.split("-").map(Number);
  const start = new Date(p[0], p[1] - 1, p[2]), end = new Date(p[0], p[1] - 1, p[2] + 1);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const what = "Deadline: " + title + (employer ? " (" + employer + ")" : "");
  return ["BEGIN:VEVENT", "UID:" + String(id).replace(/[^\w.-]/g, "-") + "@internship-finder", "DTSTAMP:" + stamp,
          "DTSTART;VALUE=DATE:" + ymd(start), "DTEND;VALUE=DATE:" + ymd(end), "SUMMARY:" + esc(what),
          "DESCRIPTION:" + esc(url), safeUrl(url) ? "URL:" + url : "", "BEGIN:VALARM", "TRIGGER:-P2D", "ACTION:DISPLAY",
          "DESCRIPTION:" + esc(what), "END:VALARM", "END:VEVENT"].filter(Boolean).join("\r\n");
}
function downloadIcs(events, name) {
  if (!events.length) { toast("No deadlines with a date to add"); return; }
  download(["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//internship-finder//EN", ...events, "END:VCALENDAR"].join("\r\n") + "\r\n",
           name, "text/calendar");
}
function calendarButton(id, title, employer, url, deadline) {
  if (!deadline || !deadline.date || daysUntil(deadline.date) < 0) return null;
  const b = el("button", { text: "Add to calendar" });
  b.onclick = () => downloadIcs([icsEvent(id, title, employer, url, deadline.date)], "deadline.ics");
  return b;
}


/* ---- details (saved in this browser) ---- */
const GFIELDS = ["mitt_navn", "navn", "studieprogram", "semester", "kontakt_epost", "telefon"];
const group = (() => {
  const saved = load(GKEY), g = {};
  GFIELDS.forEach((f) => {
    let d = DATA.group[f];
    if (Array.isArray(d)) d = d.join(", ");
    d = /\[/.test(d || "") ? "" : (d || "");          // [placeholders] from config count as empty
    g[f] = typeof saved[f] === "string" ? saved[f] : d;
  });
  return g;
})();
function groupReady() {
  const who = mode === "intern" ? group.mitt_navn : group.navn;
  return who.trim() && group.studieprogram.trim() && group.kontakt_epost.trim();
}
function paintGroup() {
  const ready = groupReady();
  $("me").classList.toggle("todo", !ready);
  $("me-title").textContent = ready ? (mode === "intern" ? "My details (used in the emails)" : "Our details (used in the emails)")
    : "Start here: add your name and contact details so the emails are filled in";
}
GFIELDS.forEach((f) => {
  const inp = $("g-" + f);
  inp.value = group[f];
  inp.addEventListener("input", () => { group[f] = inp.value; store(GKEY, group); paintGroup(); });
  inp.addEventListener("change", render);
});

/* ---- email ---- */
function reason(r) {
  const ai = r.matches.ai.length, cloud = r.matches.cloud.length;
  if (ai && cloud) return "dere jobber med begge deler";
  if (ai) return "dere jobber med kunstig intelligens";
  if (cloud) return "dere jobber med skyteknologi";
  return "vi tror det kan være nyttig i det dere jobber med";
}
function fill(s, r) {
  const vals = {
    firma: r.name, grunn: reason(r),
    ide: r.idea.no || "et internt verktøy eller en prototype dere har bruk for",
    semester: group.semester.trim() || "våren 2027",
    studieprogram: group.studieprogram.trim() || "[studieprogram]",
    navn: group.navn.trim() || "[navn]",
    mitt_navn: group.mitt_navn.trim() || "[ditt navn]",
    sommer: "sommeren " + nextSummer(),
    studiested: DATA.profile.studiested || "OsloMet",
    nivaa: DATA.profile.nivaa || "bachelor",
    ferdig: String(DATA.profile.ferdig || ""),
    kontakt_epost: group.kontakt_epost.trim() || "[e-post]",
    telefon: group.telefon.trim(),
  };
  return s.replace(/\{(\w+)\}/g, (m, k) => (k in vals ? vals[k] : m)).replace(/\n{3,}/g, "\n\n").trimEnd() + "\n";
}
const emailFor = (r) => {
  const t = mode === "intern" ? DATA.intern_template : DATA.template;
  return { subject: fill(t.subject, r).trim(), body: fill(t.body, r) };
};
const mailto = (addr) => "mailto:" + encodeURIComponent(addr).replace("%40", "@");
function copy(text) {
  const fallback = () => {
    const ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); toast(ok ? "Email text copied" : "Could not copy; select it manually");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("Email text copied"), fallback);
  else fallback();
}

/* ---- what each tab shows ---- */
const contacted = (r) => ["sent", "replied", "meeting"].includes(st(r.id).status);
const tracked = (id) => !!(itrack[id] && itrack[id].status);
function hay(parts) { return parts.filter(Boolean).join(" ").toLowerCase(); }

function items(which) {
  which = which || tab;
  const q = $("q").value.trim().toLowerCase();
  const match = (text) => !q || text.includes(q);
  if (mode === "bachelor") {
    const tier = $("f-tier").value, sector = $("f-sector").value;
    const inTab = { best: (r) => r.best && !st(r.id).status, contacted, all: () => true }[which];
    return DATA.rows.filter((r) => inTab(r) && (!tier || r.tier === tier) && (!sector || r.sectors.includes(sector))
      && match(hay([r.name, r.description, r.industry, r.municipality, r.note, r.idea.en, st(r.id).note, ...r.tech, ...r.sectors])))
      .map((r) => ({ kind: "company", r }));
  }
  const type = $("f-type").value, onlyNew = $("f-new").checked, showClosed = $("f-closed").checked;
  const fits = (fit) => $("f-nofit").checked || fit.verdict !== "no";
  if (which === "open") {
    return DATA.listings.filter((l) => !tracked(l.id) && fits(l.fit) && (!type || l.type === type) && (!onlyNew || isNew(l))
      && (showClosed || !deadlineInfo(l.deadline).closed)
      && match(hay([l.title, l.employer, l.location, l.excerpt, DATA.types[l.type]])))
      .sort((a, b) => deadlineInfo(a.deadline).sort - deadlineInfo(b.deadline).sort || fitRank(a.fit) - fitRank(b.fit))
      .map((l) => ({ kind: "listing", l }));
  }
  if (which === "programmes") {
    const year = new Date().getFullYear();
    const rank = (r) => {
      const d = r.internship.deadline, i = d ? deadlineInfo(d) : null;
      return (i && !i.closed ? i.sort : 5e6) - (r.internship.season >= year ? 1e5 : 0)
        - r.internship.keywords.length * 100 - r.openings * 1e4 + fitRank(r.internship.fit) * 50;
    };
    return DATA.rows.filter((r) => r.internship && !tracked("co:" + r.id) && fits(r.internship.fit)
      && match(hay([r.name, r.description, r.municipality, ...r.tech, ...r.sectors, ...r.internship.keywords])))
      .sort((a, b) => rank(a) - rank(b))
      .map((r) => ({ kind: "programme", r }));
  }
  // mine: everything with a status, including ads that have since disappeared
  const order = { interview: 0, offer: 1, applied: 2, saved: 3, rejected: 4 };
  const sid = (x) => (x.kind === "listing" ? x.l.id : x.kind === "programme" ? "co:" + x.r.id : x.id);
  return Object.keys(itrack).filter((id) => itrack[id].status).map((id) => {
    if (listingsById[id]) return { kind: "listing", l: listingsById[id] };
    const r = id.startsWith("co:") ? rowsById[id.slice(3)] : null;
    if (r && r.internship) return { kind: "programme", r };
    return { kind: "gone", id, snap: itrack[id].snap || {} };
  }).filter((x) => match(hay(x.kind === "listing" ? [x.l.title, x.l.employer] : x.kind === "programme" ? [x.r.name] : [x.snap.title, x.snap.employer])))
    .sort((a, b) => order[itrack[sid(a)].status] - order[itrack[sid(b)].status]);
}

/* ---- would they take me? (verdict computed from the ad text when the program ran) ---- */
const fitRank = (fit) => (fit.verdict === "no" ? 3 : fit.verdict === "check" ? 2 : fit.field ? 0 : 1);
function fitBadge(fit) {
  if (fit.verdict === "no") return el("span", { class: "badge plain", text: "Probably not for you: " + fit.reason });
  if (fit.verdict === "check") return el("span", { class: "badge warn", text: "Check: " + fit.reason });
  if (fit.field) return el("span", { class: "badge good", text: "Asks for your field" });
  return null;
}
const openForMe = (l) => l.fit.verdict !== "no" && !deadlineInfo(l.deadline).closed;

const HINTS = {
  best: "Found your project? Double-click «Ferdig med bachelorprosjekt.command» in the folder to switch this tool to internships only. Your notes are kept.",
  open: "Real job ads for students in the Oslo area that a bachelor student in IT can apply to, soonest deadline first. Sources: arbeidsplassen.no (NAV), company job boards and company websites. Not every employer publishes there, so also check: ",
  programmes: "Companies whose own site says they take interns, summer students or trainees, even if no ad is out right now. Good for an open application.",

};
const SEARCHES = [["finn.no", "https://www.finn.no/job/search?q=summer+internship+IT"],
                  ["LinkedIn", "https://www.linkedin.com/jobs/search/?keywords=summer%20internship%20software&location=Oslo"],

function render() {

  const hiddenN = tab === "programmes" ? DATA.rows.filter((r) => r.internship && r.internship.fit.verdict === "no").length
                                       : DATA.listings.filter((l) => l.fit.verdict === "no").length;
  $("nofit-label").textContent = "Show ones I probably can't get (" + hiddenN + ")";

/* ---- backup / restore: everything this browser remembers, in one file ---- */
function backup() {
  download(JSON.stringify({ app: "internship-finder", version: 1, saved: new Date().toISOString(), track, itrack, group }, null, 1),
           "internship-finder-backup-" + new Date().toISOString().slice(0, 10) + ".json", "application/json");
  try { localStorage.setItem(BKEY, String(Date.now())); } catch (e) {}
  render();
}
function restore(text) {
  let d = null;
  try { d = JSON.parse(text); } catch (e) {}
  if (!d || d.app !== "internship-finder" || typeof d.itrack !== "object") { toast("That is not a backup file from this tool"); return; }
  if (!confirm("Replace what this browser has saved with the backup from " + String(d.saved).slice(0, 10) + "?")) return;
  store(KEY, d.track || {}); store(IKEY, d.itrack || {}); store(GKEY, d.group || {});
  location.reload();
}
function csvCell(v) {
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportBachelor() {
  const lines = [["name", "status", "notes", "email", "website"].map(csvCell).join(";")];
  Object.keys(track).forEach((id) => {
    const s = track[id], r = rowsById[id] || {};
    if (s.status || s.note) lines.push([r.name || id, s.status, s.note, r.email, r.website].map(csvCell).join(";"));
  });
  download("﻿" + lines.join("\n"), "bachelor-tracking.csv", "text/csv");
}
$("backup").onclick = backup;
$("restore").onclick = () => $("restore-file").click();
$("restore-file").onchange = (e) => { const f = e.target.files[0]; if (f) f.text().then(restore); };
$("ics-all").onclick = () => {
  const ev = [];
  Object.keys(itrack).forEach((id) => {
    const s = itrack[id]; if (!s.status || s.status === "rejected") return;
    const l = listingsById[id], snap = s.snap || {};
    const d = l ? l.deadline : snap.deadline;
    if (d && d.date && daysUntil(d.date) >= 0) ev.push(icsEvent(id, l ? l.title : snap.title, l ? l.employer : snap.employer, l ? l.url : snap.url, d.date));
  });
  downloadIcs(ev, "internship-deadlines.ics");
};

document.querySelectorAll(".modes button").forEach((b) => b.onclick = () => {
  mode = b.dataset.mode; tab = TABS[mode][0][0]; shown = PAGE;
  try { localStorage.setItem(MKEY, mode); } catch (e) {}
  render();
});
["q", "f-tier", "f-sector", "f-type", "f-new", "f-closed", "f-nofit"].forEach((id) => $(id).addEventListener("input", () => { shown = PAGE; render(); }));
$("more").onclick = () => { shown += PAGE; render(); };
$("export").onclick = () => {
  const cell = (v) => {
    let s = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  let lines;
  if (mode === "bachelor") {
    lines = [["name", "status", "notes", "email", "website"].map(cell).join(";")];
    DATA.rows.forEach((r) => { const s = st(r.id); if (s.status || s.note) lines.push([r.name, s.status, s.note, r.email, r.website].map(cell).join(";")); });
  } else {
    lines = [["position", "employer", "status", "notes", "deadline", "link"].map(cell).join(";")];
    Object.keys(itrack).forEach((id) => {
      const s = itrack[id]; if (!s.status && !s.note) return;
      const l = listingsById[id], snap = s.snap || {};
      lines.push([l ? l.title : snap.title, l ? l.employer : snap.employer, s.status, s.note,
                  ((l ? l.deadline : snap.deadline) || {}).date || "", l ? l.url : snap.url].map(cell).join(";"));
    });
  }
  const a = el("a", { href: URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" })),
                      download: mode === "bachelor" ? "bachelor-tracking.csv" : "internship-tracking.csv" });
  document.body.append(a); a.click(); a.remove();
};

// #intern or #intern:programmes opens a given view directly
(() => {
  const [m, t] = location.hash.slice(1).split(":");
  if (TABS[m] && (BACHELOR_ON || m === "intern")) { mode = m; tab = TABS[m][0][0]; if (t && TABS[m].some((x) => x[0] === t)) tab = t; }
})();
if (!groupReady()) $("me").open = true;
render();

// The program re-runs in the background; reload now and then to pick up the new file,
// but never while someone is typing or choosing something.
setInterval(() => {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  location.reload();
}, 15 * 60 * 1000);
</script>
</body>
